server:
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    default: local
  application:
    name: restaurant-system
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

logging:
  level:
    com.restaurant.system: INFO